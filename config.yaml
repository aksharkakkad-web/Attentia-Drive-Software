# === Attentia Drive Configuration ===
# All tunable parameters. The system is fully configurable without touching code.

# === Frame Source ===
frame_source:
  type: "webcam"          # "webcam" or "video"
  webcam_index: 0
  video_path: ""          # Path to .mp4/.avi for replay mode
  target_fps: 30
  resolution: [640, 480]

# === Classifier ===
classifier:
  enabled: true
  model_path: "models/classifier.tflite"  # Drop-in. Not bundled.
  input_size: [224, 224]
  confidence_threshold: 0.7

# === Object Detector ===
object_detector:
  enabled: true
  model_path: "models/efficientdet_lite0.tflite"  # EfficientDet-Lite0 with embedded labelmap.
  input_size: [320, 320]
  confidence_threshold: 0.70  # PRD §19 — single source of truth via PHONE_CONFIDENCE_THRESHOLD
  target_classes: ["cell phone", "cup", "bottle", "book", "laptop"]
  frame_skip: 2           # Run detector every N frames to save compute.

# === Temporal Smoothing (EMA) ===
temporal_smoothing:
  enabled: true
  alpha: 0.3              # EMA weight. Higher = more responsive, noisier. Range 0.05-0.5.
  window_size: 10         # Number of frames for EMA context (informational; EMA is recursive).

# === Hysteresis State Machine ===
hysteresis:
  enter_distracted_threshold: 0.75    # Smoothed prob must exceed this to enter DISTRACTED.
  leave_distracted_threshold: 0.55    # Smoothed prob must drop below this to leave DISTRACTED.
  enter_monitoring_threshold: 0.40    # Above this but below enter_distracted -> MONITORING.
  leave_monitoring_threshold: 0.35    # Below this -> back to ATTENTIVE.

# === Object Temporal Confirmation (N-of-M) ===
object_confirmation:
  enabled: true
  n: 15                   # Object must appear in N of last M frames.
  m: 30

# === Alert Manager ===
alert_manager:
  sustained_frames: 90        # ~3 seconds at 30fps. Must be distracted for this many frames.
  sustained_ratio: 0.80       # 80% of sustained_frames window must be DISTRACTED.
  cooldown_seconds: 5.0       # Minimum seconds between consecutive alerts.

# === Display ===
display:
  enabled: true
  show_bboxes: true
  show_ema_plot: true         # Mini rolling graph of smoothed probability.
  show_fps: true
  show_state: true
  window_name: "Attentia Drive — Debug"

# === Telemetry / Logging ===
telemetry:
  enabled: true
  log_file: "logs/telemetry.csv"
  log_interval_frames: 1     # Log every frame. Set higher to reduce disk I/O.

# === Face Detector (MediaPipe Face Mesh) ===
face_detector:
  enabled: true
  model_type: "mediapipe"
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  refine_landmarks: false     # MVP override: iris landmarks (468-477) unused in pipeline; disabling saves ~15-20ms/frame
  yaw_threshold: 25.0           # degrees off-center → "looking away"
  pitch_down_threshold: 15.0    # degrees looking down → phone/lap
  pitch_up_threshold: 10.0
  ear_threshold: 0.21           # EAR below this → eyes closed

# === Drowsiness Detection ===
drowsiness:
  enabled: true
  ear_threshold: 0.21
  perclos_window_seconds: 60.0
  perclos_threshold: 0.15       # NHTSA standard: 12-15%
  mar_threshold: 0.6            # mouth aspect ratio → yawn
  yawn_min_frames: 10

speed_monitor:
  enabled: false
  speed_threshold_mph: 15
