# === Attentia Drive Configuration ===
# All tunable parameters. The system is fully configurable without touching code.

# === Frame Source ===
frame_source:
  type: "webcam"          # "webcam" or "video"
  webcam_index: 0
  video_path: ""          # Path to .mp4/.avi for replay mode
  target_fps: 30
  resolution: [640, 480]
  threaded: true

# === Classifier ===
classifier:
  enabled: true
  model_path: "models/classifier.tflite"  # Drop-in. Not bundled.
  input_size: [224, 224]
  confidence_threshold: 0.7
  frame_skip: 2
  num_threads: 4

# === Object Detector ===
object_detector:
  enabled: true
  model_path: "models/ssd_mobilenet_v1.tflite"  # SSD MobileNet V1 COCO, proper post-processed.
  input_size: [300, 300]
  confidence_threshold: 0.5
  target_classes: ["cell phone", "cup", "bottle", "book", "laptop"]
  frame_skip: 10          # Run detector every N frames to save compute.
  num_threads: 4

# === Temporal Smoothing (EMA) ===
temporal_smoothing:
  enabled: true
  alpha: 0.45             # EMA weight. Higher = more responsive, noisier. Range 0.05-0.5.
  window_size: 10         # Number of frames for EMA context (informational; EMA is recursive).

# === Hysteresis State Machine ===
hysteresis:
  enter_distracted_threshold: 0.45    # Smoothed prob must exceed this to enter DISTRACTED.
  leave_distracted_threshold: 0.34    # Smoothed prob must drop below this to leave DISTRACTED.
  enter_monitoring_threshold: 0.28    # Above this but below enter_distracted -> MONITORING.
  leave_monitoring_threshold: 0.22    # Below this -> back to ATTENTIVE.

# === Object Temporal Confirmation (N-of-M) ===
object_confirmation:
  enabled: true
  n: 15                   # Object must appear in N of last M frames.
  m: 30

# === Alert Manager ===
alert_manager:
  sustained_frames: 90        # ~3 seconds at 30fps. Must be distracted for this many frames.
  sustained_ratio: 0.80       # 80% of sustained_frames window must be DISTRACTED.
  cooldown_seconds: 5.0       # Minimum seconds between consecutive alerts.

# === Display ===
display:
  enabled: true
  show_bboxes: true
  show_ema_plot: true         # Mini rolling graph of smoothed probability.
  show_fps: true
  show_state: true
  window_name: "Attentia Drive — Debug"

# === Telemetry / Logging ===
telemetry:
  enabled: true
  log_file: "logs/telemetry.csv"
  log_interval_frames: 1     # Log every frame. Set higher to reduce disk I/O.
  flush_interval: 30

# === Face Detector (MediaPipe Face Mesh) ===
face_detector:
  enabled: true
  model_type: "mediapipe"
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  refine_landmarks: false
  yaw_threshold: 25.0           # degrees off-center → "looking away"
  pitch_down_threshold: 15.0    # degrees looking down → phone/lap
  pitch_up_threshold: 10.0
  ear_threshold: 0.21           # EAR below this → eyes closed
  inference_width: 320
  inference_height: 240

# === Drowsiness Detection ===
drowsiness:
  enabled: true
  ear_threshold: 0.21
  perclos_window_seconds: 60.0
  perclos_threshold: 0.15       # NHTSA standard: 12-15%
  mar_threshold: 0.6            # mouth aspect ratio → yawn
  yawn_min_frames: 10

speed_monitor:
  enabled: false
  speed_threshold_mph: 15

# === Audio Alerter ===
audio:
  enabled: true
  onset_delay_seconds: 0.25   # Delay before first beep after DISTRACTED is entered.
  rollover_seconds: 0.5       # Initial beep interval at onset of distraction.
  rollover_min_seconds: 0.2   # Floor: beep interval never drops below this.
  rollover_decay_seconds: 5.0 # Distraction duration (s) at which the floor is reached.
  frequency_hz: 2000          # Beep tone pitch (Windows winsound.Beep).
  duration_ms: 100            # Beep duration in milliseconds.
